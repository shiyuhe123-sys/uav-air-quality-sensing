<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
<title id="title">The active RTL comparison boundary</title>
<desc id="desc">Recorded targets enter a controller, mixer, four motor models and six-degree-of-freedom plant. The simulated state closes feedback. Logged motion initializes the model once and is subsequently used only as the comparison reference.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#46676b"/></marker></defs>
<rect width="1120" height="380" rx="18" fill="#f4f8f8"/>
<g font-family="Arial,sans-serif" fill="#163b40">
<text x="40" y="43" font-size="22" font-weight="700">What the RTL experiment tests</text>
<text x="40" y="71" font-size="15">Recorded commands in; simulated dynamics and feedback; logged estimates for comparison.</text>
<g fill="#fff" stroke="#b6cbcd" stroke-width="1.4">
<rect x="40" y="127" width="175" height="78" rx="10"/>
<rect x="255" y="127" width="170" height="78" rx="10"/>
<rect x="465" y="127" width="140" height="78" rx="10"/>
<rect x="645" y="127" width="170" height="78" rx="10"/>
<rect x="855" y="127" width="220" height="78" rx="10"/>
</g>
<g text-anchor="middle" font-size="18" font-weight="700">
<text x="127" y="157">Recorded targets</text><text x="340" y="157">Controller</text><text x="535" y="157">Motor mixer</text><text x="730" y="157">Four motors</text><text x="965" y="157">Six-DOF plant</text>
</g>
<g text-anchor="middle" font-size="14">
<text x="127" y="183">position / altitude / accel.</text><text x="340" y="183">selected, frozen gains</text><text x="535" y="183">thrust allocation</text><text x="730" y="183">lag + actuator limits</text><text x="965" y="183">simulated position / attitude</text>
</g>
<g fill="none" stroke="#46676b" stroke-width="2" marker-end="url(#arrow)">
<path d="M215 166H249"/><path d="M425 166H459"/><path d="M605 166H639"/><path d="M815 166H849"/>
<path d="M965 205V246H340V211"/><path d="M965 101V121"/>
</g>
<text x="623" y="237" font-size="15" text-anchor="middle">The model's own state closes the feedback loop</text>
<text x="1055" y="95" text-anchor="end" font-size="13">One logged state at initialization</text>
<rect x="40" y="283" width="1035" height="61" rx="10" fill="#e3eeee"/>
<text x="62" y="307" font-size="16" font-weight="700">Comparison reference: GPS XY + CTUN altitude / climb + logged attitude</text>
<text x="62" y="330" font-size="14">Same flight • estimator-based reference • no later measured-state reset • independent-flight prediction remains unverified</text>
</g></svg>
